<div class="reviewbar" role="region" aria-label="Kontrol review prototype"><span><b>PROTOTYPE R3</b> · Data dummy · Belum disetujui</span><details id="reviewTools"><summary>Skenario review</summary><div class="tools"><label for="scenario">Keadaan layar</label><select id="scenario"><option value="normal">Normal</option><option value="empty">Kosong</option><option value="loading">Loading</option><option value="error">Error jaringan</option><option value="denied">Akses ditolak</option></select><button data-act="failNext">Gagalkan aksi berikut</button><button data-act="fixture" data-id="negative">Koreksi saldo negatif</button><button data-act="fixture" data-id="conflict">Konflik reward</button><button data-act="denied">Coba akses keluarga lain</button><button data-act="reset">Reset data R3</button></div><small>Jam simulasi: 22 November 2026, 10.00 WIB. Reset menghapus perubahan dummy. Keamanan produksi belum diuji.</small></details></div>

<script>
'use strict';
const KEY='ruang-bersama-ux-r1';
const BASE=Date.parse('2026-11-22T10:00:00+07:00');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=(s,c='')=>`<span class="badge ${c}">${esc(s)}</span>`;
const btn=(label,act,id='',cls='')=>`<button class="${cls}" data-act="${act}" data-id="${esc(id)}" ${act==='complete'?`data-occ="${task(id)?.occ}"`:''}>${label}</button>`;
const NOTICE='Permintaan tidak mereservasi saldo. Reward belum dijamin sampai Parent menyetujui.';
function seed(){return {rev:0,clock:BASE,setup:true,family:'Keluarga Cemara',zone:'Asia/Jakarta',members:[{id:'p',name:'Ayu',role:'Parent',active:true},{id:'n',name:'Nara',role:'Member',active:true},{id:'b',name:'Bima',role:'Member',active:true},{id:'d',name:'Dito',role:'Member',active:false}],areas:[{id:'a1',name:'Dapur',active:true},{id:'a2',name:'Ruang keluarga',active:true},{id:'a3',name:'Taman',active:true},{id:'a4',name:'Gudang',active:true}],tasks:[
{id:'t1',title:'Cuci piring setelah sarapan',area:'a1',assignee:'n',points:15,interval:1,verify:false,active:true,due:'2026-11-22T09:00:00+07:00',status:'open',occ:1,attempted:false,last:null},
{id:'t2',title:'Rapikan rak buku',area:'a2',assignee:'b',points:20,interval:7,verify:true,active:true,due:'2026-11-21T17:00:00+07:00',status:'pending',occ:1,attempted:true,last:null},
{id:'t3',title:'Siram tanaman teras',area:'a3',assignee:'n',points:10,interval:1,verify:false,active:true,due:'2026-11-22T17:00:00+07:00',status:'open',occ:1,attempted:false,last:null},
{id:'t4',title:'Bersihkan kompor',area:'a1',assignee:'p',points:30,interval:7,verify:true,active:true,due:'2026-11-22T12:00:00+07:00',status:'open',occ:1,attempted:false,last:null},
{id:'t5',title:'Lipat selimut ruang keluarga',area:'a2',assignee:'n',points:30,interval:2,verify:true,active:true,due:'2026-11-23T08:30:00+07:00',status:'open',occ:2,attempted:false,last:'h1'}],
rewards:[{id:'r1',name:'Pilih film malam keluarga',cost:80,active:true,art:'▷'},{id:'r2',name:'Sarapan menu favorit',cost:80,active:true,art:'☀'},{id:'r3',name:'Waktu bermain ekstra',cost:50,active:true,art:'✦'}],requests:[{id:'q1',reward:'r3',member:'b',name:'Waktu bermain ekstra',cost:50,status:'pending',submitted:'2026-11-22T08:00:00+07:00'}],
history:[{id:'h1',task:'t5',title:'Lipat selimut ruang keluarga',member:'n',points:30,submitted:'2026-11-21T08:00:00+07:00',decided:'2026-11-21T08:30:00+07:00',actor:'p',verify:true,status:'valid',occ:1,due:'2026-11-21T09:00:00+07:00',interval:2},
{id:'h2',task:'t2',title:'Rapikan rak buku',member:'b',points:20,submitted:'2026-11-22T08:15:00+07:00',verify:true,status:'pending',occ:1,due:'2026-11-21T17:00:00+07:00',interval:7}],
ledger:[{id:'l0',member:'n',amount:70,title:'Penyelesaian dummy sebelumnya',at:'2026-11-20T08:00:00+07:00'},{id:'l1',member:'n',amount:30,title:'Lipat selimut ruang keluarga',at:'2026-11-21T08:30:00+07:00'},{id:'l2',member:'b',amount:60,title:'Penyelesaian dummy sebelumnya',at:'2026-11-20T09:00:00+07:00'}]};}
let memoryState=null;
function read(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(memoryState)||seed()}catch{return memoryState?structuredClone(memoryState):seed()}}
let db=read(),user=null,page='home',filter='all',scenario='normal',failNext=false,storageWarning=false,preview=null,lastFocus=null,rewardView=null;
function save(){db.rev++;memoryState=structuredClone(db);try{localStorage.setItem(KEY,JSON.stringify(db))}catch{storageWarning=true}}
function fresh(){db=read()}
function now(){db.clock+=60000;return new Date(db.clock).toISOString()}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
const member=id=>db.members.find(m=>m.id===id);
const area=id=>db.areas.find(a=>a.id===id);
const task=id=>db.tasks.find(t=>t.id===id);
const parent=()=>member(user)?.role==='Parent';
const balance=id=>db.ledger.filter(l=>l.member===id).reduce((s,l)=>s+l.amount,0);
const name=id=>member(id)?.name||'Anggota';
function fmt(d){return d?new Intl.DateTimeFormat('id-ID',{dateStyle:'medium',timeStyle:'short',timeZone:db.zone}).format(new Date(d)):'—'}
const visible=t=>parent()||t.assignee===user;
const overdue=t=>t.status!=='done'&&Date.parse(t.due)<db.clock;
const visibleHistory=()=>db.history.filter(h=>parent()||h.member===user);
function flash(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(flash.timer);flash.timer=setTimeout(()=>$('#toast').hidden=true,6000)}
function err(message){$('#formError').textContent=message}
function mutate(action){fresh();if(!member(user)?.active){user=null;close();render();flash('Akses tidak aktif. Minta bantuan Parent.');return false}if(failNext){failNext=false;err('Aksi belum disimpan. Koneksi simulasi terputus. Coba kembali; data tetap utuh.');flash('Aksi gagal. Coba lagi.');return false}try{action();save();close();render();return true}catch(e){err(e.message);flash(e.message);return false}}
function onlyParent(){if(!parent())throw Error('Akses ditolak. Hanya Parent dapat melakukan tindakan ini.')}
function modal(title,body){rewardView=null;lastFocus=document.activeElement;$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;err('');if(!$('#modal').open)$('#modal').showModal()}
function close(){const refresh=!!rewardView,opener=lastFocus?.dataset;$('#modal').close();preview=null;rewardView=null;if(refresh)render();const restore=lastFocus?.isConnected?lastFocus:opener?.act?document.querySelector(`[data-act="${CSS.escape(opener.act)}"][data-id="${CSS.escape(opener.id||'')}"]`):null;restore?.focus()}
function actions(label='Simpan'){return `<div class="actions">${btn('Batal','close')}<button class="primary" type="submit">${label}</button></div>`}
function field(label,id,type='text',value='',extra=''){return `<label for="${id}">${label}</label><input id="${id}" name="${id}" type="${type}" value="${esc(value)}" ${extra}>`}
function options(items,value){return items.map(i=>`<option value="${i.id}" ${i.id===value?'selected':''}>${esc(i.name)}</option>`).join('')}
function deny(){modal('Akses ditolak',`<div class="notice error">Anda tidak memiliki izin untuk membuka halaman atau data ini.</div><p>Gunakan akun yang sesuai atau kembali ke tugas Anda. Data keluarga lain tidak ditampilkan.</p>${btn('Kembali','close','','primary')}`)}
function render(){if(user&&!member(user)?.active)user=null;$('#scenario').value=scenario;$('#app').innerHTML=user?shell():login();if(storageWarning&&!document.getElementById('storageNote')){const note=document.createElement('p');note.id='storageNote';note.className='notice warn';note.textContent='Mode review tanpa penyimpanan browser: perubahan dummy bertahan selama halaman ini terbuka. Muat ulang mengembalikan data awal.';document.querySelector('#main').append(note)}}
function login(){return `<main id="main" class="main login" tabindex="-1"><div class="brand"><span class="brandmark" aria-hidden="true">⌂</span>Ruang Bersama</div><p class="eyebrow">Rumah terawat, bersama-sama.</p><h1>Setiap bantuan<br>punya arti.</h1><p class="muted">Satu tempat untuk pekerjaan rumah, apresiasi kecil, dan kebiasaan baik keluarga.</p><div class="card"><h2>Masuk ke keluarga</h2><p class="notice">Akses simulasi UX. Pilih identitas dummy; metode masuk aman akan diputuskan pada architecture.</p><form id="loginForm"><label for="identity">Identitas dummy</label><select id="identity" name="identity">${db.members.map(m=>`<option value="${m.id}">${esc(m.name)} · ${m.role}${m.active?'':' · nonaktif'}</option>`).join('')}</select><div class="actions"><button class="primary" type="submit">Masuk simulasi</button></div></form><p><small>Akses anak tidak memerlukan email.</small></p>${btn('Simulasikan setup keluarga baru','setup','','ghost small')}</div><p class="footer">UX R3 · Seluruh nama dan aktivitas adalah data dummy.</p></main>`}
function shell(){const pending=db.history.filter(h=>h.status==='pending').length;const navs=parent()?[['home','Ringkasan'],['tasks','Tugas keluarga'],['verify','Verifikasi '+(pending?`(${pending})`:'')],['history','Riwayat & poin'],['rewards','Reward'],['family','Keluarga']]:[['home','Beranda'],['tasks','Tugas saya'],['history','Riwayat & poin'],['rewards','Reward']];return `<div class="shell"><aside class="sidebar"><div class="brand"><span class="brandmark" aria-hidden="true">⌂</span><span>Ruang<br> Bersama</span></div><div class="familylabel"><small class="eyebrow">Rumah kita</small><p>${esc(db.family)}</p></div><nav class="nav" aria-label="Navigasi utama">${navs.map(([id,label])=>`<button data-act="nav" data-id="${id}" ${page===id?'aria-current="page"':''}>${label}</button>`).join('')}</nav><div class="profile"><div class="row"><span class="avatar">${esc(name(user)[0])}</span><div><b>${esc(name(user))}</b><br><small>${parent()?'Parent / Admin':'Member'}</small></div></div><p><small>Hal kecil. Dampak besar.</small></p></div></aside><div class="content"><header class="topbar"><span>${esc(db.family)} &nbsp; / &nbsp; ${parent()?'Ruang Parent':'Ruang Member'}</span><span>${esc(name(user))} · ${esc(db.zone)} ${btn('Keluar / ganti akun','logout','','ghost small')}</span></header><main class="main" id="main" tabindex="-1">${content()}<p class="footer">Ruang Bersama · ${esc(db.zone)} · Prototype R3 / D2 · data simulasi</p></main></div></div>`}
function content(){if(['verify','family'].includes(page)&&!parent())return `<div class="empty"><h1>Akses ditolak</h1><p>Halaman ini hanya tersedia untuk Parent.</p>${btn('Kembali ke tugas','nav','tasks','primary')}</div>`;if(scenario==='denied')return `<div class="empty"><h1>Akses ditolak</h1><p>Anda tidak memiliki izin untuk data ini. Hubungi Parent.</p>${btn('Kembali ke tampilan normal','normal','','primary')}</div>`;if(scenario==='loading')return `<div role="status" aria-busy="true"><h1>Memuat ${titles()[page].toLowerCase()}…</h1><p>Menyiapkan informasi terbaru keluarga.</p><div class="skeleton"></div><div class="skeleton"></div>${btn('Selesaikan simulasi loading','normal')}</div>`;if(scenario==='error')return `<div class="empty" role="alert"><h1>Belum bisa memuat data</h1><p>Koneksi terputus. Perubahan yang sudah dikonfirmasi tetap tersimpan. Periksa hasil sebelum mengulangi tindakan.</p>${btn('Coba lagi','normal','','primary')}</div>`;if(scenario==='empty')return heading(titles()[page],'')+emptyPage();return ({home:home,tasks:tasksPage,verify:verifyPage,history:historyPage,rewards:rewardsPage,family:familyPage}[page]||home)()}
function titles(){return {home:'Ruang keluarga',tasks:parent()?'Tugas keluarga':'Tugas saya',verify:'Menunggu verifikasi',history:'Riwayat & poin',rewards:'Apresiasi kecil',family:'Keluarga & area'}}
function heading(title,sub,action=''){return `<div class="heading"><div><h1>${title}</h1><p class="muted">${sub}</p></div>${action}</div>`}
function emptyPage(){let title='Belum ada aktivitas',copy='Selesaikan tugas pertama untuk mulai mencatat kontribusi keluarga.',action=btn('Lihat tugas','nav','tasks','primary');if(page==='tasks'){title='Belum ada tugas';copy=parent()?'Buat tugas pertama dan pilih satu penanggung jawab.':'Parent belum menugaskan pekerjaan kepada Anda. Kembali lagi nanti.';action=parent()?btn('+ Buat tugas','taskForm','','primary'):btn('Ke beranda','nav','home')}if(page==='verify'){title='Semua sudah ditinjau';copy='Pengajuan berikutnya akan muncul di sini.';action=btn('Lihat tugas keluarga','nav','tasks')}if(page==='rewards'){title='Belum ada reward';copy=parent()?'Tambahkan apresiasi yang disepakati keluarga.':'Parent belum menambahkan reward. Poin Anda tetap tercatat.';action=parent()?btn('+ Tambah reward','rewardForm','','primary'):btn('Lihat poin','nav','history')}if(page==='family'){title='Mulai bersama keluarga';copy='Tambahkan anggota tanpa mewajibkan email anak, lalu siapkan area rumah.';action=btn('+ Tambah anggota','memberForm','','primary')}return `<div class="card empty"><div class="symbol" aria-hidden="true">✧</div><h2>${title}</h2><p class="muted">${copy}</p>${action}<p><small>Data asli simulasi tetap ada. Gunakan “Normal” untuk kembali.</small></p></div>`}
function taskCard(t){const last=db.history.filter(h=>h.task===t.id&&h.status==='valid').sort((a,b)=>Date.parse(b.decided)-Date.parse(a.decided))[0];return `<article class="task"><div class="taskicon" aria-hidden="true">${t.area==='a3'?'❋':t.area==='a1'?'◒':'▥'}</div><div><h3>${esc(t.title)}</h3><div class="taskmeta">${esc(area(t.area)?.name)} · ${esc(name(t.assignee))} · ${t.interval?`Setiap ${t.interval} hari ${t.verify?'sejak disetujui Parent':'sejak tugas selesai'}`:'Sekali jalan'}</div><div class="badges">${!t.active?badge('Diarsipkan','gray'):''}${t.status==='pending'?badge('Menunggu verifikasi','amber'):t.status==='done'?badge('Selesai'):badge('Perlu dikerjakan','blue')}${overdue(t)&&t.active?badge('Terlambat','red'):''}${t.verify?badge('Verifikasi Parent','gray'):''}</div><div class="taskmeta">Tenggat: ${fmt(t.due)}<br>Terakhir selesai: ${last?`${esc(name(last.member))}, ${fmt(last.decided)}`:'Belum pernah'}</div></div><div class="taskend"><p class="points">+${t.points} poin</p>${btn('Lihat tugas','detail',t.id,'small')}</div></article>`}
function home(){const ts=db.tasks.filter(t=>t.active&&visible(t));const hs=visibleHistory().filter(h=>h.status==='valid');return heading(`Selamat pagi, ${esc(name(user))}.`,parent()?'Ada hal baik yang bisa kita kerjakan bersama hari ini.':'Bantuan kecilmu membuat rumah terasa lebih nyaman.')+`<section class="hero"><div><p class="eyebrow">Minggu, 22 November 2026</p><h2>${parent()?'Rumah yang nyaman,<br>hasil kerja bersama.':'Satu tugas kecil,<br>satu langkah berarti.'}</h2><p>${parent()?'Lihat yang perlu perhatian, beri apresiasi, dan rayakan kontribusi semua anggota.':'Lihat tugasmu hari ini. Setiap pekerjaan yang selesai membawa kita lebih dekat ke rumah yang rapi.'}</p>${btn(parent()?'Tinjau pengajuan':'Lihat tugas saya','nav',parent()?'verify':'tasks')}</div><div class="sun" aria-hidden="true">✳</div></section><div class="grid stats"><div class="card stat"><small>Terlambat</small><strong>${ts.filter(overdue).length}</strong><p>Butuh perhatian</p></div><div class="card stat"><small>Menunggu verifikasi</small><strong>${ts.filter(t=>t.status==='pending').length}</strong><p>Belum mendapat poin</p></div><div class="card stat"><small>Selesai</small><strong>${hs.length}</strong><p>Setelah koreksi</p></div></div><div class="grid two"><section><div class="sectionhead"><h2>${parent()?'Perlu perhatian':'Tugas terdekat'}</h2>${btn('Lihat semua','nav','tasks','ghost small')}</div><div class="card">${ts.filter(t=>t.status!=='done').sort((a,b)=>Date.parse(a.due)-Date.parse(b.due)).slice(0,3).map(taskCard).join('')||'<p>Semua tugas selesai. Terima kasih!</p>'}</div></section><section><div class="sectionhead"><h2>${parent()?'Kontribusi keluarga':'Poin apresiasimu'}</h2></div><div class="card">${parent()?db.members.filter(m=>m.active).map(m=>{const valid=db.history.filter(h=>h.member===m.id&&h.status==='valid');const net=db.ledger.filter(l=>l.member===m.id&&l.kind!=='reward').reduce((s,l)=>s+l.amount,0);return `<div class="contribution"><span class="avatar">${esc(m.name[0])}</span><div><b>${esc(m.name)}</b><br><small>${valid.length} tugas selesai tercatat · ${net} poin perolehan bersih</small><div class="bar"><span style="width:${Math.min(100,Math.max(0,net))}%"></span></div></div><small>Saldo<br><b>${balance(m.id)}</b></small></div>`}).join(''):`<p class="balance">${balance(user)} <small>poin</small></p><p class="muted">Terima kasih sudah ikut merawat rumah.</p>${btn('Jelajahi reward','nav','rewards','primary')}`}<p><small>Kontribusi bersih setelah koreksi, sebelum belanja reward. Saldo memperhitungkan penukaran.</small></p></div><div class="notice">${parent()?'Tugas yang terlambat tetap ditandai terlambat sampai disetujui. Untuk tugas dengan verifikasi, jadwal berikutnya dihitung sejak disetujui Parent.':'Tugas dengan verifikasi baru memberi poin setelah disetujui Parent.'}</div></section></div>`}
function tasksPage(){let ts=db.tasks.filter(visible);if(filter==='archive')ts=ts.filter(t=>!t.active);else ts=ts.filter(t=>t.active&&t.status!=='done'&&(filter==='late'?overdue(t):filter==='pending'?t.status==='pending':true));return heading(titles().tasks,'Satu penanggung jawab, status yang jelas.',parent()?btn('+ Buat tugas','taskForm','','primary'):'')+`<div class="filters" role="group" aria-label="Filter tugas">${[['all','Aktif'],['late','Terlambat'],['pending','Menunggu'],['archive','Arsip']].map(([id,l])=>btn(l,'filter',id,'small '+(filter===id?'active':''))).join('')}</div><h2 class="sr-only">Daftar tugas</h2><div class="card">${ts.map(taskCard).join('')||`<div class="empty"><h2>Tidak ada tugas di daftar ini</h2><p>${parent()?'Buat tugas atau pilih filter lain.':'Belum ada pekerjaan untukmu di daftar ini.'}</p>${parent()?btn('+ Buat tugas','taskForm','','primary'):''}</div>`}</div>`}
function verifyPage(){const hs=db.history.filter(h=>h.status==='pending');return heading('Menunggu verifikasi','Periksa pekerjaan sebelum memberikan poin.')+(hs.length?hs.map(h=>`<div class="card"><div class="row between"><div><h2>${esc(h.title)}</h2><p>${esc(name(h.member))} · Diajukan ${fmt(h.submitted)}</p><div class="badges">${badge('Menunggu verifikasi','amber')}${overdue(task(h.task))?badge('Terlambat','red'):''}${h.member===user?badge('Verifikasi diri','blue'):''}</div></div><b>+${h.points} poin setelah disetujui Parent</b></div><p class="muted">Tenggat asal: ${fmt(h.due)}. Belum ada poin atau giliran pekerjaan berikutnya.</p><div class="row">${btn('Tinjau pengajuan','reviewTask',h.id,'primary')}${btn('Detail tugas','detail',h.task)}</div></div>`).join(''):emptyPage())}
function historyPage(){const hs=visibleHistory().slice().reverse();const ls=db.ledger.filter(l=>parent()||l.member===user).slice().reverse();return heading('Riwayat & poin','Jejak pekerjaan dan apresiasi, tetap utuh setelah koreksi.')+`<div class="grid ${parent()?'':'two'}">${(parent()?db.members.filter(m=>m.active):[member(user)]).map(m=>`<div class="card"><small>Saldo ${esc(m.name)}</small><p class="balance">${balance(m.id)} <small>poin</small></p>${balance(m.id)<0?'<div class="notice warn">Saldo negatif akibat koreksi. Penukaran menunggu saldo cukup.</div>':''}</div>`).join('')}</div><h2>Penyelesaian tugas</h2>${hs.map(h=>`<article class="card"><div class="row between"><div><h3>${esc(h.title)}</h3><p class="muted">${esc(name(h.member))} · Giliran ${h.occ}</p></div>${badge(({valid:h.verify?'Disetujui Parent':'Selesai',pending:'Menunggu verifikasi',rejected:'Ditolak',cancelled:'Dibatalkan'})[h.status],h.status==='pending'?'amber':h.status==='cancelled'||h.status==='rejected'?'red':'')}</div><p><small>Diajukan: ${fmt(h.submitted)}<br>${h.verify?`Keputusan Parent: ${fmt(h.decided)}${h.actor?' · '+esc(name(h.actor)):''}`:'Selesai; tidak memerlukan persetujuan Parent'}${h.actor===h.member&&h.verify?' · Verifikasi diri':''}<br>${h.reason?'Alasan: '+esc(h.reason)+'<br>':''}${h.cancelledAt?'Dibatalkan: '+fmt(h.cancelledAt)+' · '+esc(name(h.cancelActor))+'<br>':''}${h.cancelledNext?'Giliran '+h.cancelledNext.occ+' dinonaktifkan; tenggat sebelumnya '+fmt(h.cancelledNext.due)+'<br>':''}Dampak poin: ${h.status==='valid'?'+'+h.points:h.status==='cancelled'?'+'+h.points+' kredit asli, −'+h.points+' koreksi':'0'}</small></p>${parent()&&h.status==='valid'?btn('Batalkan penyelesaian','cancelPreview',h.id,'small danger'):''}</article>`).join('')||'<div class="card">Belum ada pengajuan tugas.</div>'}<h2>Transaksi poin</h2><div class="card tablewrap"><table><thead><tr><th>Aktivitas / waktu</th>${parent()?'<th>Anggota</th>':''}<th>Perubahan</th></tr></thead><tbody>${ls.map(l=>`<tr><td>${esc(l.title)}<br><small>${fmt(l.at)}</small></td>${parent()?`<td>${esc(name(l.member))}</td>`:''}<td><b>${l.amount>0?'+':''}${l.amount}</b></td></tr>`).join('')||'<tr><td>Belum ada transaksi.</td></tr>'}</tbody></table></div><p class="muted">Data awal juga berisi kredit historis dummy untuk mencoba reward. Jumlah penyelesaian hanya menghitung detail yang tersedia.</p>`}
function rewardsPage(){const rs=db.rewards.filter(r=>parent()||r.active),qs=db.requests.filter(q=>parent()||q.member===user);return heading('Apresiasi kecil','Rayakan kontribusi dengan sesuatu yang disepakati bersama.',parent()?btn('+ Tambah reward','rewardForm','','primary'):`<div><small>Saldo Anda</small><div class="balance">${balance(user)} <small>poin</small></div></div>`)+`<div class="notice warn">${NOTICE} Pemenuhan dilakukan manual di luar aplikasi.</div><div class="grid">${rs.map(r=>`<article class="card reward"><div class="rewardart" aria-hidden="true">${r.art||'✧'}</div><h2>${esc(r.name)}</h2><p>${r.cost} poin ${!r.active?badge('Nonaktif','gray'):''}</p><div class="row">${parent()?btn('Edit reward','rewardForm',r.id,'small'):btn('Minta reward','requestPreview',r.id,'primary')}</div></article>`).join('')||'<div class="card">Belum ada reward aktif.</div>'}</div><div class="sectionhead"><h2>Permintaan reward</h2><small>${parent()?'Seluruh keluarga':'Permintaan Anda'}</small></div>${qs.slice().reverse().map(q=>`<div class="card"><div class="row between"><div><h3>${esc(q.name)}</h3><p>${esc(name(q.member))} · Biaya tersimpan: ${q.cost} poin</p></div>${badge(({pending:'Menunggu keputusan',approved:'Disetujui',rejected:'Ditolak'})[q.status],q.status==='pending'?'amber':'')}</div><p><small>Diajukan: ${fmt(q.submitted)}${q.decided?'<br>Diputuskan: '+fmt(q.decided)+' · '+esc(name(q.actor)):''}</small></p>${q.status==='pending'?`<p class="muted">${NOTICE}</p>${parent()?btn('Tinjau permintaan','rewardReview',q.id,'primary'):''}`:q.status==='approved'?'<p>Poin telah dibelanjakan. Pemenuhan dilakukan manual; status ini bukan bukti reward sudah diserahkan.</p>':`<p>Alasan: ${esc(q.reason)}</p>`}</div>`).join('')||'<div class="card">Belum ada permintaan reward.</div>'}`}
function familyPage(){return heading('Keluarga & area','Atur rumah bersama, dengan akses sesuai peran.',btn('+ Tambah anggota','memberForm','','primary'))+`<div class="notice">Zona waktu keluarga: <b>${esc(db.zone)}</b>. Zona waktu dikunci setelah setup untuk MVP.</div><h2>Anggota keluarga</h2><div class="grid two">${db.members.map(m=>`<article class="card"><div class="row"><span class="avatar">${esc(m.name[0])}</span><div><h3>${esc(m.name)}</h3><small>${m.role} · ${m.active?'Aktif':'Nonaktif'}</small></div></div>${m.role==='Member'?`<div class="row" style="margin-top:18px">${btn('Pulihkan akses','recover',m.id,'small')}${m.active?btn('Nonaktifkan','deactivate',m.id,'small danger'):''}</div>`:'<p><small>Pengelola keluarga dan verifikasi.</small></p>'}</article>`).join('')}</div><div class="sectionhead"><h2>Area rumah</h2>${btn('+ Tambah area','areaForm','','small')}</div><div class="grid two">${db.areas.map(a=>`<article class="card"><div class="row between"><div><h3>${esc(a.name)}</h3><small>${a.active?'Aktif':'Diarsipkan'}</small></div>${btn('Edit area','areaForm',a.id,'small')}</div></article>`).join('')}</div>`}
function detail(id){const t=task(id);if(!t||!visible(t)){deny();return}const h=db.history.filter(h=>h.task===id).at(-1);modal(t.title,`<div class="badges">${badge(t.active?'Aktif':'Diarsipkan')}${badge(t.status==='pending'?'Menunggu verifikasi':t.status==='done'?'Selesai':'Perlu dikerjakan',t.status==='pending'?'amber':'blue')}${overdue(t)?badge('Terlambat','red'):''}</div><dl><dt>Area</dt><dd>${esc(area(t.area)?.name)}</dd><dt>Penanggung jawab</dt><dd>${esc(name(t.assignee))}</dd><dt>Tenggat</dt><dd>${fmt(t.due)} · ${esc(db.zone)}</dd><dt>Apresiasi</dt><dd>${t.points} poin ${t.verify?'setelah disetujui Parent':'saat selesai'}</dd><dt>Jadwal</dt><dd>${t.interval?`Setiap ${t.interval} hari ${t.verify?'sejak disetujui Parent':'sejak tugas selesai'}`:'Sekali jalan'}</dd></dl>${h?.status==='rejected'?`<div class="notice warn">Pengajuan ditolak: ${esc(h.reason)}. Perbaiki lalu ajukan ulang. Tenggat tetap ${fmt(t.due)}.</div>`:''}${t.status==='pending'?'<div class="notice warn">Menunggu keputusan Parent. Belum mendapat poin. Jadwal berikutnya belum dibuat sampai Parent menyetujui; perubahan dan arsip dikunci.</div>':''}<div class="actions">${parent()?btn('Edit','taskForm',id)+btn(t.active?'Arsipkan':'Aktifkan kembali','archiveTask',id):''}${t.active&&t.status==='open'&&t.assignee===user?btn('Tandai selesai','complete',id,'primary'):''}${t.active&&t.status==='pending'&&parent()?btn('Tinjau pengajuan','reviewTask',db.history.find(x=>x.task===id&&x.status==='pending')?.id,'primary'):''}</div>`)}
function taskForm(id){if(!parent()){deny();return}const t=task(id);if(t?.status==='pending'){modal('Perubahan dikunci','<div class="notice warn">Putuskan pengajuan pending sebelum mengubah aturan tugas atau mengarsipkannya.</div>');return}const val=t||{title:'',area:'a1',assignee:'n',points:10,due:'2026-11-23T09:00',interval:0,verify:false};const local=new Intl.DateTimeFormat('sv-SE',{timeZone:db.zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(val.due)).replace(' ','T');modal(t?'Edit tugas':'Buat tugas',`<form id="taskForm" data-id="${id||''}" novalidate>${field('Judul pekerjaan','title','text',val.title,'required maxlength="120"')}<div class="formgrid"><div><label for="area">Area aktif</label><select name="area" id="area">${options(db.areas.filter(a=>a.active),val.area)}</select></div><div><label for="assignee">Satu penanggung jawab</label><select name="assignee" id="assignee">${options(db.members.filter(m=>m.active),val.assignee)}</select></div><div>${field('Poin (bilangan bulat ≥0)','points','number',val.points,'min="0" step="1" required')}</div><div>${field('Tenggat awal · '+db.zone,'due','datetime-local',local,'required')}</div></div>${field('Interval hari (0 = sekali jalan)','interval','number',val.interval,'min="0" step="1" required')}<small>Untuk tugas berulang, jadwal berikutnya dihitung sejak tugas selesai. Jika perlu verifikasi, dihitung sejak disetujui Parent. Jarak minimal 1 hari.</small><label><input name="verify" type="checkbox" ${val.verify?'checked':''}> Perlu verifikasi Parent</label>${actions(t?'Simpan perubahan':'Buat tugas')}</form>`)}
function reviewTask(id){if(!parent()){deny();return}const h=db.history.find(h=>h.id===id);if(!h||h.status!=='pending'){flash('Pengajuan sudah diputuskan.');return}modal('Tinjau penyelesaian',`<h3>${esc(h.title)}</h3><dl><dt>Pengaju</dt><dd>${esc(name(h.member))}${h.member===user?' · Verifikasi diri (dicatat)':''}</dd><dt>Diajukan</dt><dd>${fmt(h.submitted)}</dd><dt>Tenggat asal</dt><dd>${fmt(h.due)}</dd><dt>Poin setelah disetujui Parent</dt><dd>+${h.points}</dd></dl><p>Poin diberikan dan perhitungan jadwal berikutnya dimulai saat Parent menyetujui. ${h.interval?'Tenggat berikutnya: '+fmt(new Date(db.clock+60000+h.interval*86400000)): 'Tugas sekali jalan akan selesai.'}</p><label for="reason">Alasan (wajib jika menolak)</label><textarea id="reason" placeholder="Contoh: masih ada buku yang belum ditata."></textarea><div class="actions">${btn('Tolak pengajuan','taskReject',id,'danger')}${btn('Setujui & beri poin','taskApprove',id,'primary')}</div>`)}
function credit(h){const t=task(h.task);h.status='valid';h.decided=h.verify?now():h.submitted;h.actor=h.verify?user:h.member;db.ledger.push({id:uid(),member:h.member,amount:h.points,title:h.title,at:h.decided,history:h.id});t.last=h.id;if(h.interval){t.occ++;t.status='open';t.attempted=false;t.due=new Date(Date.parse(h.decided)+h.interval*86400000).toISOString()}else t.status='done'}
function complete(id,occ){if(mutate(()=>{const t=task(id);if(!t||t.assignee!==user||!t.active)throw Error('Akses ditolak: hanya penanggung jawab aktif.');if(t.status!=='open'||t.occ!==Number(occ))throw Error('Pengajuan sudah tercatat. Periksa riwayat.');const h={id:uid(),task:id,title:t.title,member:user,points:t.points,submitted:now(),verify:t.verify,status:'pending',occ:t.occ,due:t.due,interval:t.interval};t.attempted=true;db.history.push(h);if(t.verify)t.status='pending';else credit(h)}))flash('Pengajuan tersimpan. Lihat status terbaru dan riwayat poin.')}
function taskDecision(id,approve){const reason=$('#reason').value.trim();if(!approve&&!reason){err('Isi alasan penolakan agar anggota tahu yang perlu diperbaiki.');return}if(mutate(()=>{onlyParent();const h=db.history.find(h=>h.id===id);if(h?.status!=='pending')throw Error('Pengajuan sudah diputuskan. Tidak ada poin tambahan.');if(approve)credit(h);else{h.status='rejected';h.reason=reason;h.actor=user;h.decided=now();task(h.task).status='open'}}))flash(approve?'Penyelesaian disetujui. Poin tercatat satu kali.':'Ditolak dengan alasan. Tenggat asal dipertahankan.')}

function cancelConfirm(id){const reason=$('#cancelReason').value.trim();if(!reason){err('Alasan pembatalan wajib diisi.');return}fresh();if(db.rev!==preview?.rev){cancelPreview(id);err('Dampak berubah sejak pratinjau. Periksa saldo dan jadwal terbaru, isi alasan dan konfirmasi ulang.');return}if(mutate(()=>{onlyParent();const h=db.history.find(h=>h.id===id);if(!canCancel(h))throw Error('Tidak dapat dibatalkan: sudah ada pengajuan berikutnya atau koreksi sebelumnya.');h.status='cancelled';h.cancelledAt=now();h.cancelActor=user;h.reason=reason;h.cancelledNext=task(h.task).occ>h.occ?{occ:task(h.task).occ,due:task(h.task).due}:null;db.ledger.push({id:uid(),member:h.member,amount:-h.points,title:'Koreksi: '+h.title,at:h.cancelledAt,history:h.id});const t=task(h.task);t.status='open';t.occ=h.occ;t.due=h.due;t.attempted=true;t.last=db.history.filter(x=>x.task===t.id&&x.status==='valid').at(-1)?.id||null;}))flash('Penyelesaian dibatalkan. Debit koreksi dan perubahan jadwal tercatat.')}

function rewardReviewData(id){
 const q=db.requests.find(q=>q.id===id);
 if(!q)return null;
 return {id:q.id,name:q.name,member:q.member,cost:q.cost,balance:balance(q.member),status:q.status,active:!!db.rewards.find(r=>r.id===q.reward)?.active,authorized:parent()&&!!member(user)?.active};

function refreshRewardReview(message=''){
 if(!rewardView||!$('#modal').open)return;
 const current=rewardReviewData(rewardView.id);
 rewardView.snapshot=JSON.stringify(current);
 const pending=current?.status==='pending',available=!!current?.active,enough=current&&current.balance>=current.cost,allowed=!!current?.authorized;
 const approve=$('#modal [data-act="rewardApprove"]'),reject=$('#modal [data-act="rewardReject"]');
 const approvalHadFocus=document.activeElement===approve;
 approve.disabled=!(allowed&&pending&&available&&enough);
 reject.disabled=!(allowed&&pending);
 $('#rewardFigures').innerHTML=current?`<dl><dt>Anggota</dt><dd>${esc(name(current.member))}</dd><dt>Status</dt><dd>${badge(({pending:'Menunggu keputusan',approved:'Disetujui',rejected:'Ditolak'})[current.status]||'Tidak tersedia',pending?'amber':'')}</dd><dt>Saldo terbaru</dt><dd><b>${current.balance} poin</b></dd><dt>Biaya permintaan</dt><dd>${current.cost} poin (tersimpan saat pengajuan)</dd><dt>Kekurangan poin</dt><dd><b>${Math.max(0,current.cost-current.balance)} poin</b></dd>${enough?`<dt>Saldo setelah persetujuan</dt><dd>${current.balance-current.cost} poin</dd>`:''}</dl>`:'<p>Permintaan tidak tersedia. Tutup dialog untuk memuat daftar terbaru.</p>';
 let explanation;
 if(!allowed)explanation='Akses ditolak. Hanya Parent aktif dapat memutuskan permintaan.';
 else if(!pending)explanation='Permintaan sudah diputuskan atau tidak tersedia. Tidak ada keputusan atau pengurangan poin tambahan.';
 else if(!available)explanation='Reward nonaktif. Persetujuan dinonaktifkan; penolakan tetap tersedia. Permintaan tetap pending sampai Parent memutuskan.';
 else if(!enough)explanation=`Saldo belum cukup. Kurang ${current.cost-current.balance} poin untuk menyetujui reward ini. Tombol Setujui dinonaktifkan. Permintaan tetap pending dan dapat disetujui nanti jika saldo mencukupi serta reward masih aktif. Anda tetap dapat menolaknya dengan alasan.`;
 else explanation='Saldo mencukupi. Parent dapat menyetujui sekarang atau menolak dengan alasan. Saldo diperiksa lagi sebelum keputusan diterapkan.';
 $('#rewardEligibility').className='notice '+(approve.disabled?'warn':'');
 $('#rewardEligibility').textContent=explanation;
 $('#rewardUpdated').textContent=message;
 // A focused approval button may become disabled after a balance change.
 $('#modal [data-act=close]:not([aria-label])').textContent=pending?'Tutup, tetap pending':'Tutup';

}
function syncRewardReview(){
 if(!rewardView||!$('#modal').open)return false;
 fresh();
 if(JSON.stringify(rewardReviewData(rewardView.id))===rewardView.snapshot)return false;
 refreshRewardReview('Informasi diperbarui. Periksa saldo, biaya, dan status terbaru sebelum memilih keputusan.');
 return true;
}

 fresh();

 const q=db.requests.find(q=>q.id===id);
 if(q?.status!=='pending'){flash('Permintaan sudah diputuskan.');return}
 modal('Putuskan permintaan reward',`<h3>${esc(q.name)}</h3><p id="rewardUpdated" role="status" aria-live="polite" tabindex="-1"></p><div id="rewardFigures"></div><div id="rewardEligibility" role="status" aria-live="polite" aria-atomic="true"></div><p class="muted">${NOTICE} Pemenuhan dilakukan manual di luar aplikasi.</p><p>Persetujuan membelanjakan ${q.cost} poin dan bersifat final. Tidak ada refund di MVP.</p><label for="rewardReason">Alasan (wajib jika menolak)</label><textarea id="rewardReason"></textarea><details><summary>Skenario review lokal</summary><p><small>Data dummy: simulasikan perubahan saldo dari aktivitas di tab lain. Ini bukan fitur edit saldo produk.</small></p><div class="row">${btn('Simulasi saldo +60 poin','rewardBalanceSim','60','small')}${btn('Simulasi saldo −80 poin','rewardBalanceSim','-80','small')}</div></details><div class="actions">${btn('Tutup, tetap pending','close')}${btn('Tolak permintaan','rewardReject',id,'danger')}<button class="primary" data-act="rewardApprove" data-id="${esc(id)}" aria-describedby="rewardEligibility" disabled>Setujui & belanjakan ${q.cost} poin</button></div>`);

function rewardDecision(id,approve){
 // Re-read at decision time as well as on storage/focus updates. Never apply a stale preview.
 if(!rewardView||rewardView.id!==id)return;
 if(syncRewardReview())return;
 const current=rewardReviewData(id);
 if(!current?.authorized||current.status!=='pending'||approve&&(!current.active||current.balance<current.cost)){refreshRewardReview();return}
 const reason=$('#rewardReason').value.trim();
 if(!approve&&!reason){err('Isi alasan penolakan reward.');return}
 if(mutate(()=>{
  onlyParent();
  if(JSON.stringify(rewardReviewData(id))!==rewardView.snapshot){refreshRewardReview('Informasi berubah. Periksa kembali sebelum memutuskan.');throw Error('Keputusan belum diterapkan. Tinjau informasi terbaru.')}
  const q=db.requests.find(q=>q.id===id);
  if(q?.status!=='pending')throw Error('Permintaan sudah diputuskan. Tidak ada debit tambahan.');
  if(approve){
   if(!db.rewards.find(r=>r.id===q.reward)?.active)throw Error('Reward nonaktif. Permintaan tetap pending; Anda dapat menolaknya.');

   db.ledger.push({id:uid(),member:q.member,amount:-q.cost,title:'Reward: '+q.name,kind:'reward',at:now()});
  }
  q.status=approve?'approved':'rejected';q.reason=reason;q.decided=now();q.actor=user;

}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const {act,id}=el.dataset;if(act==='close'){close();return}if(act==='nav'){page=id;filter='all';render();$('#main').focus();return}if(act==='logout'){close();user=null;page='home';render();return}if(act==='normal'){scenario='normal';render();return}if(act==='failNext'){failNext=true;flash('Aksi berikut akan gagal tanpa mengubah data.');return}if(act==='reset'){modal('Reset data dummy R3',`<p>Semua perubahan simulasi akan dikembalikan ke data awal.</p><div class="actions">${btn('Batal','close')}${btn('Reset sekarang','resetConfirm','','danger')}</div>`);return}if(act==='resetConfirm'){db=seed();save();user=null;scenario='normal';page='home';close();render();flash('Data dummy direset.');return}if(act==='fixture'){fixture(id);return}if(act==='denied'){deny();return}if(act==='setup'){setup();return}if(!user){deny();return}

g sama sudah pending.');db.requests.push({id:uid(),reward:id,member:user,name:r.name,cost:r.cost,status:'pending',submitted:now()})}))flash('Permintaan terkirim. Saldo tidak direservasi.')},changeImpact:()=>{db.ledger.push({id:uid(),member:db.history.find(h=>h.id===preview.id).member,amount:5,title:'Perubahan saldo simulasi dari tab lain',at:now()});save();flash('Saldo berubah. Konfirmasi akan meminta Anda meninjau ulang.')}

let message='Perubahan tersimpan.';const ok=mutate(()=>{onlyParent();switch(form.id){case 'taskForm':{const points=Number(v('points')),interval=Number(v('interval'));if(!v('title')||!v('due')||!v('points')||!v('interval'))throw Error('Judul, poin, interval, dan tenggat wajib diisi.');if(!Number.isInteger(points)||points<0||!Number.isInteger(interval)||interval<0)throw Error('Poin harus bilangan bulat ≥0; interval 0 atau bilangan bulat ≥1.');if(!area(v('area'))?.active||!member(v('assignee'))?.active)throw Error('Pilih area dan satu anggota aktif.');const due=localDateToISO(v('due'));const data={title:v('title'),area:v('area'),assignee:v('assignee'),points,interval,verify:f.has('verify'),due};if(id){const t=task(id);if(t.status==='pending')throw Error('Pengajuan pending mengunci perubahan.');Object.assign(t,data)}else db.tasks.push({id:uid(),...data,active:true,status:'open',occ:1,attempted:false,last:null});break}case 'rewardForm':{const cost=Number(v('cost'));if(!v('rewardName')||!Number.isInteger(cost)||cost<=0)throw Error('Nama wajib diisi; biaya harus bilangan bulat >0.');const data={name:v('rewardName'),cost,active:f.has('active')};if(id)Object.assign(db.rewards.find(r=>r.id===id),data);else db.rewards.push({id:uid(),...data,art:'✧'});break}case 'memberForm':if(!v('memberName'))throw Error('Nama anggota wajib diisi.');db.members.push({id:uid(),name:v('memberName'),role:'Member',active:true});message='Identitas dummy dibuat tanpa email anak.';break;case 'areaForm':if(!v('areaName'))throw Error('Nama area wajib diisi.');if(id&&!f.has('active')&&db.tasks.some(t=>t.area===id&&t.active))throw Error('Area masih memiliki tugas aktif. Arsipkan atau pindahkan tugas terlebih dahulu.');if(id)Object.assign(area(id),{name:v('areaName'),active:f.has('active')});else db.areas.push({id:uid(),name:v('areaName'),active:f.has('active')});break;default:throw Error('Form tidak dikenal.')}});if(ok)flash(message)});
